<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Interview preparation built around the one job you're trying to land." />
    <meta name="theme-color" content="#0c1c38" />
    <!-- Installable web app. Vite prefixes these public-file paths with the base (/offerready-app/ on GitHub Pages). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OfferReady" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>OfferReady</title>
  </head>
  <body>
    <!-- Launch screen: the logo on brand navy, once per visit (every launch of
         the installed app). Inline so it shows before the app's code loads;
         src/main.tsx hides it after the first render (min 2.5 s, max 4 s). -->
    <style>
      #or-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 80% at 50% 35%, #163a5c 0%, #0c1c38 55%, #081327 100%); color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; transition: opacity .6s ease, visibility .6s; }
      #or-splash.out { opacity: 0; visibility: hidden; }
      #or-splash .m { width: 112px; height: 112px; animation: orpop .6s cubic-bezier(.2,.9,.3,1.3) both; filter: drop-shadow(0 12px 30px rgba(34,192,122,.25)); }
      #or-splash .arrow { stroke-dasharray: 40; stroke-dashoffset: 40; animation: ordraw .5s .35s ease-out forwards; }
      #or-splash .w { font-size: 34px; font-weight: 700; letter-spacing: -.02em; animation: orup .5s .25s ease-out both; }
      #or-splash .w span { color: #22c07a; }
      #or-splash .t { margin: 0; font-size: 15px; color: rgba(232,240,252,.72); animation: orup .5s .4s ease-out both; }
      @keyframes orpop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes orup { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes ordraw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { #or-splash *, #or-splash { animation: none !important; transition: none !important; } #or-splash .arrow { stroke-dashoffset: 0; } }
    </style>
    <div id="or-splash" aria-hidden="true">
      <svg class="m" viewBox="0 0 48 48"><path d="M33 11 A15 15 0 1 0 35 21" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><path d="M13 33 L19 20 L25 11" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path class="arrow" d="M25 11 L31 5 M31 5 L24 6 M31 5 L30 12" fill="none" stroke="#22c07a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="w">Offer<span>Ready</span></div>
      <p class="t">Ready for the job you want.</p>
    </div>
    <script>
      (function () {
        var el = document.getElementById("or-splash"), t0 = Date.now(), done = false;
        var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
        var seen = false;
        try { seen = !!sessionStorage.getItem("or_splash"); sessionStorage.setItem("or_splash", "1"); } catch (e) {}
        function hide() { if (done || !el) return; done = true; el.classList.add("out"); setTimeout(function () { el && el.remove(); }, 650); }
        if (seen && !standalone) { el && el.remove(); window.__hideSplash = function () {}; return; }
        window.__hideSplash = function () { setTimeout(hide, Math.max(0, 2500 - (Date.now() - t0))); };
        setTimeout(hide, 4000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
