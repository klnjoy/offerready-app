name: Deploy app to GitHub Pages

# Builds the React app and publishes it to
# https://klnjoy.github.io/offerready-app/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build
        env:
          # The app is served from a sub-path on GitHub Pages.
          VITE_BASE: /offerready-app/
          # The API stays on Vercel (klnjoy/offerready). It already allows
          # requests from https://klnjoy.github.io.
          VITE_API_BASE: https://offerready-beta.vercel.app

      - name: Single-page app fallback
        # GitHub Pages serves 404.html for unknown paths; making it the app
        # means deep links like /offerready-app/jobs/123 load on refresh.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
